name: Cloudflare Production
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PRODUCTION_URL: https://communication-planner.karukimori.workers.dev
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install dependencies from package manifest
        run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npx wrangler whoami
      - run: npx wrangler d1 info communication-planner
      - run: npx wrangler d1 execute communication-planner --remote --file=db/schema.d1.sql --yes
      - name: Apply SafetyCheck hash migration when needed
        shell: bash
        run: |
          if npx wrangler d1 execute communication-planner --remote --command="SELECT checked_content_hash FROM safety_checks LIMIT 0;" --yes >/tmp/hash-column.txt 2>&1; then echo "checked_content_hash already exists"; else npx wrangler d1 execute communication-planner --remote --file=db/migrations/0002_safety_check_content_hash.sql --yes; fi
      - run: npm run deploy
      - name: Verify health, D1 and provider readiness
        run: |
          sleep 5
          curl -fsS "$PRODUCTION_URL/health"
          curl -fsS "$PRODUCTION_URL/contracts/status"
          curl -fsS "$PRODUCTION_URL/api/persistence/status" | tee /tmp/p.json
          node -e 'const x=require("/tmp/p.json");if(x.data.driver!=="d1"||!x.data.d1Reachable||!x.data.databaseBackedPersistenceReady)process.exit(1)'
          curl -fsS -X POST "$PRODUCTION_URL/api/persistence/roundtrip" | tee /tmp/r.json
          node -e 'const x=require("/tmp/r.json");if(!x.data.roundtripReady||x.data.persistenceDriver!=="d1")process.exit(1)'
          curl -fsS "$PRODUCTION_URL/api/adapters/readiness" | tee /tmp/readiness.json
          node - <<'NODE'
          const x=require('/tmp/readiness.json');const adapters=x.data.adapters;if(!Array.isArray(adapters)||adapters.length!==3)process.exit(1);for(const a of adapters){if(!['line','x','instagram'].includes(a.channel)||!['dry_run','live'].includes(a.effectiveDeliveryMode))process.exit(1);for(const group of [a.credentialRequirements,a.webhookSignatureSecrets,a.operationalRequirements]){if(!Array.isArray(group))process.exit(1);for(const r of group){if(typeof r.key!=='string'||typeof r.description!=='string'||typeof r.met!=='boolean'||Object.prototype.hasOwnProperty.call(r,'value'))process.exit(1)}}}if(JSON.stringify(x).includes('"value":'))process.exit(1);
          NODE
      - name: Verify anti-misdelivery, dashboard isolation and successful send flow
        shell: bash
        run: |
          ID="e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkmsg(){ node -e 'process.stdout.write(JSON.stringify({workspaceId:"ws_e2e",channel:process.argv[1],externalUserId:process.argv[2],externalMessageId:process.argv[3],externalThreadId:process.argv[4],displayName:process.argv[5],body:process.argv[6],direction:"inbound",topics:[process.argv[7]],promises:[process.argv[8]],nextActions:[process.argv[9]]}))' "$1" "$2" "$3" "$4" "$5" "$6" "$7" "$8" "$9"; }
          curl -fsS -H 'content-type: application/json' -d "$(mkmsg line user_a ${ID}-a thread_a 'E2E Person A' 'A private context' 'topic-A' 'promise-A' 'action-A')" "$PRODUCTION_URL/api/channel-events/messages" | tee /tmp/a.json
          curl -fsS -H 'content-type: application/json' -d "$(mkmsg instagram user_b ${ID}-b thread_b 'E2E Person B' 'B private context' 'topic-B' 'promise-B' 'action-B')" "$PRODUCTION_URL/api/channel-events/messages" | tee /tmp/b.json
          PA=$(node -e 'process.stdout.write(require("/tmp/a.json").data.personId)'); CA=$(node -e 'process.stdout.write(require("/tmp/a.json").data.conversationId)'); PB=$(node -e 'process.stdout.write(require("/tmp/b.json").data.personId)'); CB=$(node -e 'process.stdout.write(require("/tmp/b.json").data.conversationId)')
          curl -fsS "$PRODUCTION_URL/api/dashboard?workspaceId=ws_e2e" | tee /tmp/dashboard.json
          node -e 'const x=require("/tmp/dashboard.json"),pa=process.argv[1],pb=process.argv[2];if(x.data.persistenceDriver!=="d1")process.exit(1);const cs=x.data.snapshot.conversations,a=cs.find(c=>c.personId===pa),b=cs.find(c=>c.personId===pb);if(!a||!b)process.exit(1);if(a.displayName!=="E2E Person A"||a.channel!=="line"||a.context.summary!=="A private context"||!a.context.topics.includes("topic-A")||a.context.topics.includes("topic-B")||a.context.promises.includes("promise-B")||a.context.nextActions.includes("action-B"))process.exit(1);if(b.displayName!=="E2E Person B"||b.channel!=="instagram"||b.context.summary!=="B private context"||!b.context.topics.includes("topic-B")||b.context.topics.includes("topic-A")||b.context.promises.includes("promise-A")||b.context.nextActions.includes("action-A"))process.exit(1)' "$PA" "$PB"
          DRAFT=$(node -e 'process.stdout.write(JSON.stringify({workspaceId:"ws_e2e",personId:process.argv[1],conversationId:process.argv[2],purpose:"e2e reply",body:"Scoped reply for A"}))' "$PA" "$CA")
          curl -fsS -H 'content-type: application/json' -d "$DRAFT" "$PRODUCTION_URL/api/conversations/$CA/reply-drafts" | tee /tmp/draft.json
          DID=$(node -e 'process.stdout.write(require("/tmp/draft.json").data.replyDraft.replyDraftId)')
          WRONG=$(node -e 'process.stdout.write(JSON.stringify({workspaceId:"ws_e2e",personId:process.argv[1],conversationId:process.argv[2],status:"passed",issues:[]}))' "$PB" "$CB")
          STATUS=$(curl -sS -o /tmp/wrong.json -w '%{http_code}' -H 'content-type: application/json' -d "$WRONG" "$PRODUCTION_URL/api/reply-drafts/$DID/safety-check"); test "$STATUS" = "403"; node -e 'const x=require("/tmp/wrong.json");if(x?.error?.code!=="REPLY_DRAFT_SCOPE_MISMATCH")process.exit(1)'
          SAFETY=$(node -e 'process.stdout.write(JSON.stringify({workspaceId:"ws_e2e",personId:process.argv[1],conversationId:process.argv[2],status:"passed",issues:[]}))' "$PA" "$CA")
          curl -fsS -H 'content-type: application/json' -d "$SAFETY" "$PRODUCTION_URL/api/reply-drafts/$DID/safety-check" >/tmp/safety.json
          curl -fsS "$PRODUCTION_URL/api/dashboard?workspaceId=ws_e2e" | tee /tmp/ready-dashboard.json
          node -e 'const x=require("/tmp/ready-dashboard.json"),a=x.data.snapshot.conversations.find(c=>c.personId===process.argv[1]);if(!a||!a.safety.sendReady||a.replyDraft.replyDraftId!==process.argv[2])process.exit(1)' "$PA" "$DID"
          WRONG_CHANNEL=$(node -e 'process.stdout.write(JSON.stringify({workspaceId:"ws_e2e",personId:process.argv[1],conversationId:process.argv[2],channel:"instagram"}))' "$PA" "$CA")
          STATUS=$(curl -sS -o /tmp/channel.json -w '%{http_code}' -H 'content-type: application/json' -d "$WRONG_CHANNEL" "$PRODUCTION_URL/api/reply-drafts/$DID/send"); test "$STATUS" = "409"; node -e 'const x=require("/tmp/channel.json");if(x?.error?.code!=="SEND_SCOPE_MISMATCH")process.exit(1)'
          PATCH=$(node -e 'process.stdout.write(JSON.stringify({workspaceId:"ws_e2e",personId:process.argv[1],conversationId:process.argv[2],body:"Changed after SafetyCheck"}))' "$PA" "$CA")
          curl -fsS -X PATCH -H 'content-type: application/json' -d "$PATCH" "$PRODUCTION_URL/api/reply-drafts/$DID" >/dev/null
          SEND=$(node -e 'process.stdout.write(JSON.stringify({workspaceId:"ws_e2e",personId:process.argv[1],conversationId:process.argv[2],channel:"line"}))' "$PA" "$CA")
          STATUS=$(curl -sS -o /tmp/stale.json -w '%{http_code}' -H 'content-type: application/json' -d "$SEND" "$PRODUCTION_URL/api/reply-drafts/$DID/send"); test "$STATUS" = "409"; node -e 'const x=require("/tmp/stale.json");if(x?.error?.code!=="STALE_SAFETY_CHECK")process.exit(1)'
          curl -fsS -H 'content-type: application/json' -d "$SAFETY" "$PRODUCTION_URL/api/reply-drafts/$DID/safety-check" >/dev/null
          curl -fsS -H 'content-type: application/json' -d "$SEND" "$PRODUCTION_URL/api/reply-drafts/$DID/send" | tee /tmp/sent.json
          node -e 'const x=require("/tmp/sent.json");if(x.data.persistenceDriver!=="d1"||x.data.replyDraft.status!=="sent"||x.data.message.direction!=="outbound")process.exit(1)'
          STATUS=$(curl -sS -o /tmp/repeat.json -w '%{http_code}' -H 'content-type: application/json' -d "$SEND" "$PRODUCTION_URL/api/reply-drafts/$DID/send"); test "$STATUS" = "409"; node -e 'const x=require("/tmp/repeat.json");if(x?.error?.code!=="REPLY_DRAFT_ALREADY_SENT")process.exit(1)'
          npx wrangler d1 execute communication-planner --remote --command="SELECT id,direction,channel FROM messages WHERE workspace_id='ws_e2e' AND conversation_id='$CA' ORDER BY created_at DESC LIMIT 2; SELECT id,channel,delivery_mode FROM reply_send_decisions WHERE workspace_id='ws_e2e' AND reply_draft_id='$DID';" --yes
