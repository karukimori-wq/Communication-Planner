name: Cloudflare Production

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    name: Migrate D1 and deploy Worker
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate Cloudflare secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN is not configured" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "CLOUDFLARE_ACCOUNT_ID is not configured" && exit 1)

      - name: Regenerate migration lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci

      - name: Contract tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify Cloudflare authentication
        run: npx wrangler whoami

      - name: Verify production D1 exists
        run: npx wrangler d1 info communication-planner

      - name: Apply production D1 schema
        run: npx wrangler d1 execute communication-planner --remote --file=db/schema.d1.sql --yes

      - name: Verify production D1 tables
        run: npx wrangler d1 execute communication-planner --remote --command="SELECT name FROM sqlite_master WHERE type='table' AND name IN ('communication_persons','conversations','messages','reply_drafts','safety_checks','reply_send_decisions') ORDER BY name;" --yes

      - name: Deploy Cloudflare Worker
        run: npm run deploy
