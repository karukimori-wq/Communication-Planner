name: Cloudflare Production
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PRODUCTION_URL: https://communication-planner.karukimori.workers.dev
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npx wrangler whoami
      - run: npx wrangler d1 info communication-planner
      - run: npx wrangler d1 execute communication-planner --remote --file=db/schema.d1.sql --yes
      - run: npm run deploy
      - name: Verify health and D1 roundtrip
        run: |
          sleep 5
          curl -fsS "$PRODUCTION_URL/health"
          curl -fsS "$PRODUCTION_URL/contracts/status"
          curl -fsS "$PRODUCTION_URL/api/persistence/status" | tee /tmp/p.json
          node -e 'const x=require("/tmp/p.json");if(x.data.driver!=="d1"||!x.data.d1Reachable||!x.data.databaseBackedPersistenceReady)process.exit(1)'
          curl -fsS -X POST "$PRODUCTION_URL/api/persistence/roundtrip" | tee /tmp/r.json
          node -e 'const x=require("/tmp/r.json");if(!x.data.roundtripReady||x.data.persistenceDriver!=="d1")process.exit(1)'
      - name: Verify D1 business flow
        shell: bash
        run: |
          ID="e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          MSG=$(node -e 'let i=process.argv[1];process.stdout.write(JSON.stringify({workspaceId:"ws_e2e",channel:"line",externalUserId:"user_e2e",externalMessageId:i,externalThreadId:"thread_e2e",displayName:"E2E Person",body:"D1 E2E message",direction:"inbound",topics:["e2e"],promises:["verify persistence"],nextActions:["create reply"]}))' "$ID")
          curl -fsS -H 'content-type: application/json' -d "$MSG" "$PRODUCTION_URL/api/channel-events/messages" | tee /tmp/m1.json
          curl -fsS -H 'content-type: application/json' -d "$MSG" "$PRODUCTION_URL/api/channel-events/messages" | tee /tmp/m2.json
          node -e 'let a=require("/tmp/m1.json"),b=require("/tmp/m2.json");if(a.data.persistenceDriver!=="d1"||a.data.duplicate||!b.data.duplicate)process.exit(1)'
          PERSON=$(node -e 'process.stdout.write(require("/tmp/m1.json").data.personId)')
          CONV=$(node -e 'process.stdout.write(require("/tmp/m1.json").data.conversationId)')
          curl -fsS "$PRODUCTION_URL/api/inbox?workspaceId=ws_e2e" | tee /tmp/inbox.json
          curl -fsS "$PRODUCTION_URL/api/persons/$PERSON?workspaceId=ws_e2e" | tee /tmp/person.json
          curl -fsS "$PRODUCTION_URL/api/persons/$PERSON/context?workspaceId=ws_e2e" | tee /tmp/context.json
          curl -fsS "$PRODUCTION_URL/api/persons/$PERSON/conversations?workspaceId=ws_e2e" | tee /tmp/convs.json
          node -e 'for(const f of ["inbox","person","context","convs"]){let x=require(`/tmp/${f}.json`);if(x.data.persistenceDriver!=="d1")process.exit(1)}'
          DRAFT=$(node -e 'process.stdout.write(JSON.stringify({workspaceId:"ws_e2e",personId:process.argv[1],conversationId:process.argv[2],purpose:"e2e reply",body:"Scoped D1 reply"}))' "$PERSON" "$CONV")
          curl -fsS -H 'content-type: application/json' -d "$DRAFT" "$PRODUCTION_URL/api/conversations/$CONV/reply-drafts" | tee /tmp/draft.json
          DRAFT_ID=$(node -e 'process.stdout.write(require("/tmp/draft.json").data.replyDraft.replyDraftId)')
          PATCH=$(node -e 'process.stdout.write(JSON.stringify({workspaceId:"ws_e2e",personId:process.argv[1],conversationId:process.argv[2],body:"Updated scoped D1 reply"}))' "$PERSON" "$CONV")
          curl -fsS -X PATCH -H 'content-type: application/json' -d "$PATCH" "$PRODUCTION_URL/api/reply-drafts/$DRAFT_ID" | tee /tmp/patch.json
          SAFETY=$(node -e 'process.stdout.write(JSON.stringify({workspaceId:"ws_e2e",personId:process.argv[1],conversationId:process.argv[2],status:"passed",issues:[]}))' "$PERSON" "$CONV")
          curl -fsS -H 'content-type: application/json' -d "$SAFETY" "$PRODUCTION_URL/api/reply-drafts/$DRAFT_ID/safety-check" | tee /tmp/safety.json
          node -e 'for(const f of ["draft","patch","safety"]){let x=require(`/tmp/${f}.json`);if(x.data.persistenceDriver!=="d1")process.exit(1)}'
          npx wrangler d1 execute communication-planner --remote --command="SELECT id,status FROM reply_drafts WHERE workspace_id='ws_e2e' AND id='$DRAFT_ID'; SELECT id,status FROM safety_checks WHERE workspace_id='ws_e2e' AND reply_draft_id='$DRAFT_ID';" --yes
