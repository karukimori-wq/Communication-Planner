name: Cloudflare Production

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PRODUCTION_URL: https://communication-planner.karukimori.workers.dev

jobs:
  deploy:
    name: Migrate D1 and deploy Worker
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate Cloudflare secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN is not configured" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "CLOUDFLARE_ACCOUNT_ID is not configured" && exit 1)
      - name: Regenerate migration lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci
      - name: Contract tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Verify Cloudflare authentication
        run: npx wrangler whoami
      - name: Verify production D1 exists
        run: npx wrangler d1 info communication-planner
      - name: Apply production D1 schema
        run: npx wrangler d1 execute communication-planner --remote --file=db/schema.d1.sql --yes
      - name: Verify production D1 tables
        run: npx wrangler d1 execute communication-planner --remote --command="SELECT name FROM sqlite_master WHERE type='table' AND name IN ('communication_persons','conversations','messages','reply_drafts','safety_checks','reply_send_decisions') ORDER BY name;" --yes
      - name: Deploy Cloudflare Worker
        run: npm run deploy
      - name: Verify production health and D1 status
        shell: bash
        run: |
          sleep 5
          curl --fail --silent --show-error "$PRODUCTION_URL/health" | tee /tmp/health.json
          curl --fail --silent --show-error "$PRODUCTION_URL/contracts/status" | tee /tmp/contracts.json
          curl --fail --silent --show-error "$PRODUCTION_URL/api/persistence/status" | tee /tmp/persistence.json
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/persistence.json","utf8")); if(x?.data?.driver!=="d1"||x?.data?.d1Reachable!==true||x?.data?.databaseBackedPersistenceReady!==true) process.exit(1)'
      - name: Verify production D1 roundtrip
        shell: bash
        run: |
          curl --fail --silent --show-error -X POST "$PRODUCTION_URL/api/persistence/roundtrip" | tee /tmp/roundtrip.json
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/roundtrip.json","utf8")); if(x?.data?.roundtripReady!==true||x?.data?.driver!=="d1") process.exit(1)'
      - name: Verify D1 message ingestion and idempotency
        shell: bash
        run: |
          TEST_ID="github-production-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          PAYLOAD=$(node -e 'const id=process.argv[1]; process.stdout.write(JSON.stringify({workspaceId:"ws_production_smoke",channel:"line",externalUserId:"line-production-smoke",externalMessageId:id,externalThreadId:"thread-production-smoke",displayName:"Production Smoke",body:"Cloudflare D1 production persistence smoke test",direction:"inbound",topics:["production smoke"],nextActions:["verify D1 persistence"]}))' "$TEST_ID")
          curl --fail --silent --show-error -X POST -H 'content-type: application/json' --data "$PAYLOAD" "$PRODUCTION_URL/api/channel-events/messages" | tee /tmp/ingest1.json
          curl --fail --silent --show-error -X POST -H 'content-type: application/json' --data "$PAYLOAD" "$PRODUCTION_URL/api/channel-events/messages" | tee /tmp/ingest2.json
          node -e 'const fs=require("fs"); const a=JSON.parse(fs.readFileSync("/tmp/ingest1.json","utf8")); const b=JSON.parse(fs.readFileSync("/tmp/ingest2.json","utf8")); if(a?.data?.persistenceDriver!=="d1"||a?.data?.duplicate!==false||b?.data?.persistenceDriver!=="d1"||b?.data?.duplicate!==true) process.exit(1)'
          npx wrangler d1 execute communication-planner --remote --command="SELECT external_message_id, direction, body FROM messages WHERE workspace_id='ws_production_smoke' AND external_message_id='$TEST_ID';" --yes
